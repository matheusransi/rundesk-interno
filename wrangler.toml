name = "rundesk-interno"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rundesk-interno"
# Troque pelo id que o comando `npx wrangler d1 create rundesk-interno` mostrar
database_id = "COLOQUE_AQUI_O_ID_DO_BANCO"
migrations_dir = "migrations"
